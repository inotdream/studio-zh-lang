# 多平台自动构建：在 Ubuntu / Windows / macOS 上执行 npm run build 并打包，
# 将 dist/ 产物作为 Artifact 上传（不在此工作流中自动发 Release，避免需签名密钥）。
#
# 说明：
# - macOS 使用 electron-builder.yml（无 afterSign 公证），避免 electron-builder-mac.yml 在 CI 无 Apple 账号时失败。
# - Linux 仅打 deb，避免 AppImage/rpm 在 GitHub 运行器上缺依赖导致失败。
# - 必须加 --publish never：否则 electron-builder 在 CI 中会要求 GH_TOKEN 并尝试发布，导致整步失败。
# - 同时注入 GH_TOKEN，满足工具链对 GitHub API 的探测（与 publish never 配合）。
name: Build multi-platform

on:
    push:
        branches: [master, main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    package:
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      dist_cmd: npm run dist-ci-linux
                      artifact_suffix: linux
                    - os: windows-latest
                      dist_cmd: npm run dist-ci-win
                      artifact_suffix: windows
                    - os: macos-latest
                      dist_cmd: npm run dist-ci-mac-arm64
                      artifact_suffix: macos-arm64

        runs-on: ${{ matrix.os }}

        env:
            # 无 Apple 开发者证书时跳过签名探测，便于 CI 打包
            CSC_IDENTITY_AUTO_DISCOVERY: false
            # 减少 electron-builder 在 CI 上的偶发问题
            USE_HARD_LINKS: false
            # electron-builder 在 CI 中会读此变量；与 --publish never 一起避免「未设置 token」报错
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm

            - name: Setup Python (node-gyp / Windows)
              if: runner.os == 'Windows'
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Windows — long paths for npm
              if: runner.os == 'Windows'
              run: git config --global core.longpaths true

            - name: Linux — build & packaging dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential libudev-dev libnss3 fakeroot dpkg-dev

            - name: Install npm dependencies
              run: npm ci

            - name: Build (TypeScript + assets + electron-builder yml)
              run: npm run build

            - name: Create distribution packages
              run: ${{ matrix.dist_cmd }}

            - name: Upload dist artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: eez-studio-${{ matrix.artifact_suffix }}
                  path: dist/
                  if-no-files-found: warn
